  ABOUT THE NOTE THAT USED TO BE HERE
  -----------------------------------
  The previous version of this page carried the line:

      "This page is intentionally dependency-free: no framework, no CDN, no build."

  Two thirds of that is no longer true, so it has been rewritten rather than
  left in place to mislead the next reader. There IS a build step now, and the
  UI is React. Pretending otherwise in a comment would be exactly the kind of
  stale claim this dashboard exists to argue against.

  WHAT IS STILL TRUE - AND IT IS THE PART THAT MATTERED
  -----------------------------------------------------
  The page still makes ZERO external requests in order to render itself.
  Script, stylesheet and favicon are inlined into this single file. No CDN,
  no web fonts, no analytics, no tracker, no third-party anything.

  Measured on this artifact, not assumed:
      <script src=...>            0
      external stylesheet links   0
      inline <style> blocks       1
      application bundle          306,219 bytes (this comment excluded)

  That property is deliberate. Much of this project's audience reaches the page
  from networks where a third-party CDN request is the part most likely to be
  slow, blocked, or logged. One self-contained file removes that whole class of
  failure: if the HTML arrives, the page works.

  THE ONLY NETWORK TRAFFIC IS THE DATA ITSELF
  -------------------------------------------
      https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/index.json
      https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/health.json
  with cdn.jsdelivr.net used ONLY as a fallback when raw is unreachable, and
  labelled as such in the interface when it happens, because the mirror can lag
  the branch by up to 12 hours and this page reports on freshness.

  HOW IT BEHAVES WHEN THINGS GO WRONG
  -----------------------------------
  Published JSON is treated as untrusted input. Every value passes a guard
  before it reaches the DOM:
    · a missing field renders as "-", never as undefined, NaN or 0
    · an absent measurement is never printed as a measured zero - sections whose
      data was not published remove themselves, and their nav links with them
    · freshness is judged against the repository's own advertised update interval,
      and is reported as "not judgeable" when either the timestamp or the interval
      is missing, rather than defaulting to a reassuring green
    · a URL that is not http(s) is never turned into a link
    · if index.json cannot be loaded or is not a JSON object, the page renders
      NOTHING but the error - a half-populated dashboard next to an error banner
      invites the reader to trust the half that looks populated
