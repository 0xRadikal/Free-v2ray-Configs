<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="344" viewBox="0 0 1280 344" role="img" aria-labelledby="title desc">
<title id="title">V2Ray verification pipeline</title><desc id="desc">Collect, normalize, dial, prove with three HTTP rounds, validate clients, publish</desc>
<defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C78F8"/><stop offset=".53" stop-color="#247EFD"/><stop offset="1" stop-color="#1559CD"/></linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#EFF2F9" stop-opacity=".06"/><stop offset=".52" stop-color="#EFF2F9" stop-opacity=".42"/><stop offset="1" stop-color="#EFF2F9" stop-opacity=".08"/></linearGradient>
<radialGradient id="soft"><stop stop-color="#DAE5F9" stop-opacity=".14"/><stop offset="1" stop-color="#DAE5F9" stop-opacity="0"/></radialGradient>
<clipPath id="mask"><rect x="0" y="0" width="1280" height="344" rx="24"/></clipPath></defs>
<g clip-path="url(#mask)"><rect x="0" y="0" width="1280" height="344" fill="url(#blue)"/>
<circle cx="204" cy="0" r="292" fill="url(#soft)"/>
<circle cx="1254" cy="326" r="233" fill="url(#soft)"/>
<rect x="1" y="1" width="1278" height="342" rx="23" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
<text x="40" y="48" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.8" font-weight="790" fill="#DAE5F9" letter-spacing="1.8">THE VERIFICATION PIPELINE</text><text x="40" y="92" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="36" font-weight="800" fill="#EFF2F9">Proof before publication.</text><rect x="40" y="127" width="208" height="164" rx="20" fill="#EFF2F9" fill-opacity=".11" stroke="#EFF2F9" stroke-opacity=".28"/><rect x="56" y="143" width="35" height="33" rx="11" fill="#F7F9FD" fill-opacity=".15"/><text x="73.5" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">01</text><text x="102" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="790" fill="#EFF2F9" letter-spacing=".35">COLLECT</text><text x="56" y="216" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="680" fill="#EFF2F9">Healthy upstreams</text><text x="56" y="243" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.2" font-weight="500" fill="#DAE5F9">Parallel ingestion</text><path d="M56 272h176" stroke="#F7F9FD" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/><circle cx="57" cy="272" r="2.7" fill="#F7F9FD" opacity=".7"><animate attributeName="cx" values="57;231" dur="4.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="0.0s" repeatCount="indefinite"/></circle><path d="M253 207h30m-6 -5 6 5 -6 5" fill="none" stroke="#DAE5F9" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="127" width="208" height="164" rx="20" fill="#EFF2F9" fill-opacity=".11" stroke="#EFF2F9" stroke-opacity=".28"/><rect x="304" y="143" width="35" height="33" rx="11" fill="#F7F9FD" fill-opacity=".15"/><text x="321.5" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">02</text><text x="350" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="790" fill="#EFF2F9" letter-spacing=".35">NORMALIZE</text><text x="304" y="216" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="680" fill="#EFF2F9">Parse and repair</text><text x="304" y="243" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.2" font-weight="500" fill="#DAE5F9">Identity deduplication</text><path d="M304 272h176" stroke="#F7F9FD" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/><circle cx="305" cy="272" r="2.7" fill="#F7F9FD" opacity=".7"><animate attributeName="cx" values="305;479" dur="4.2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="0.6s" repeatCount="indefinite"/></circle><path d="M501 207h30m-6 -5 6 5 -6 5" fill="none" stroke="#DAE5F9" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="127" width="208" height="164" rx="20" fill="#EFF2F9" fill-opacity=".11" stroke="#EFF2F9" stroke-opacity=".28"/><rect x="552" y="143" width="35" height="33" rx="11" fill="#F7F9FD" fill-opacity=".15"/><text x="569.5" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">03</text><text x="598" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="790" fill="#EFF2F9" letter-spacing=".35">DIAL</text><text x="552" y="216" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="680" fill="#EFF2F9">Real TCP handshake</text><text x="552" y="243" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.2" font-weight="500" fill="#DAE5F9">Connectivity gate</text><path d="M552 272h176" stroke="#F7F9FD" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/><circle cx="553" cy="272" r="2.7" fill="#F7F9FD" opacity=".7"><animate attributeName="cx" values="553;727" dur="4.2s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.2s" repeatCount="indefinite"/></circle><path d="M749 207h30m-6 -5 6 5 -6 5" fill="none" stroke="#DAE5F9" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="784" y="127" width="208" height="164" rx="20" fill="#EFF2F9" fill-opacity=".11" stroke="#EFF2F9" stroke-opacity=".28"/><rect x="800" y="143" width="35" height="33" rx="11" fill="#F7F9FD" fill-opacity=".15"/><text x="817.5" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">04</text><text x="846" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="790" fill="#EFF2F9" letter-spacing=".35">PROVE</text><text x="800" y="216" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="680" fill="#EFF2F9">HTTP via proxy × 3</text><text x="800" y="243" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.2" font-weight="500" fill="#DAE5F9">Independent rounds</text><path d="M800 272h176" stroke="#F7F9FD" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/><circle cx="801" cy="272" r="2.7" fill="#F7F9FD" opacity=".7"><animate attributeName="cx" values="801;975" dur="4.2s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1.8s" repeatCount="indefinite"/></circle><path d="M997 207h30m-6 -5 6 5 -6 5" fill="none" stroke="#DAE5F9" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1032" y="127" width="208" height="164" rx="20" fill="#EFF2F9" fill-opacity=".11" stroke="#EFF2F9" stroke-opacity=".28"/><rect x="1048" y="143" width="35" height="33" rx="11" fill="#F7F9FD" fill-opacity=".15"/><text x="1065.5" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="790" fill="#EFF2F9" text-anchor="middle">05</text><text x="1094" y="166" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="790" fill="#EFF2F9" letter-spacing=".35">PUBLISH</text><text x="1048" y="216" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="680" fill="#EFF2F9">Client validation</text><text x="1048" y="243" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="13.2" font-weight="500" fill="#DAE5F9">Formats and lists</text><path d="M1048 272h176" stroke="#F7F9FD" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/><circle cx="1049" cy="272" r="2.7" fill="#F7F9FD" opacity=".7"><animate attributeName="cx" values="1049;1223" dur="4.2s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="2.4s" repeatCount="indefinite"/></circle><text x="40" y="327" font-family="'Segoe UI',Inter,Arial,'DejaVu Sans',sans-serif" font-size="14.3" font-weight="545" fill="#DAE5F9">Measured from the test runner; reachability varies by network and time.</text></g></svg>
