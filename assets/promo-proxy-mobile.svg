<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-label="Free Telegram Proxy — the sister project"><style>@media (prefers-reduced-motion: reduce){.rm0{opacity:0.5!important}.rm1{transform:none!important;opacity:0!important}.rm2{opacity:.9!important}.rm3{transform:none!important}}</style><title>Free Telegram Proxy — the sister project</title><desc>Sister project by Raydikalx: free MTProto proxies for Telegram (FakeTLS ee, secure dd and classic), each verified in three rounds by relaying a real request to a Telegram datacenter, updated about every 15 minutes. Opens the GitHub repository.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247EFD" /><stop offset=".58" stop-color="#2076F0" /><stop offset="1" stop-color="#135CCF" /></linearGradient><radialGradient id="cloud"><stop stop-color="#B4D8FF" stop-opacity=".24" /><stop offset="1" stop-color="#B4D8FF" stop-opacity="0" /></radialGradient><linearGradient id="sweep"><stop stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".14" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient><linearGradient id="edge"><stop stop-color="#EFF2F9" stop-opacity=".12" /><stop offset=".45" stop-color="#EFF2F9" stop-opacity=".8" /><stop offset="1" stop-color="#EFF2F9" stop-opacity=".12" /></linearGradient><clipPath id="round"><rect width="640" height="600" rx="22" /></clipPath></defs><g clip-path="url(#round)"><rect width="640" height="600" fill="url(#bg)" /><circle cx="96" cy="60" r="450" fill="url(#cloud)" opacity=".5" class="rm0"><animate attributeName="opacity" values=".34;.58;.34" dur="11s" repeatCount="indefinite" /></circle><circle cx="595" cy="510" r="360" fill="url(#cloud)" opacity=".4" /><g class="rm1" transform="translate(-400 0)"><rect x="0" y="0" width="260" height="600" fill="url(#sweep)" transform="skewX(-18)" /><animateTransform attributeName="transform" type="translate" values="-400 0;1040 0" dur="7s" repeatCount="indefinite" /></g><rect x="228" y="36" width="184" height="184" rx="29" fill="#EFF2F9" fill-opacity=".14" stroke="#EFF2F9" stroke-opacity=".35" /><circle cx="320" cy="128" r="62" fill="none" stroke="#EFF2F9" stroke-width="3.9" stroke-opacity=".7" /><g fill="none" stroke="#EFF2F9" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"><path d="M283.4 125.8 356.6 97.0 341.1 159.0 323.3 143.5 312.2 159.0 312.2 139.1Z" fill="#EFF2F9" fill-opacity=".16" /><path d="M312.2 139.1L356.6 97.0" stroke-opacity=".7" /></g><circle cx="363.4" cy="84.0" r="8.9" fill="#FFFFFF" stroke="#135CCF" stroke-width="2.8" /><circle cx="259.2" cy="140.4" r="8.9" fill="#FFFFFF" stroke="#135CCF" stroke-width="2.8" /><circle cx="347.9" cy="183.2" r="8.9" fill="#FFFFFF" stroke="#135CCF" stroke-width="2.8" /><circle cx="363.4" cy="84.0" r="19.4" fill="#FFFFFF" opacity=".9" class="rm2" fill-opacity=".35"><animate attributeName="opacity" values=".9;0;.9" dur="2.6s" repeatCount="indefinite" /></circle><text x="320" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="22" font-weight="760" fill="#DBEBFF" text-anchor="middle" letter-spacing="2.4">RAYDIKALX · SISTER PROJECT</text><text x="320" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="52" font-weight="820" fill="#EFF2F9" text-anchor="middle">Free Telegram Proxy</text><text x="320" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="26" font-weight="560" fill="#DBEBFF" text-anchor="middle">Proxies that open in Telegram</text><rect x="52" y="390" width="130" height="42" rx="21" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="117.0" y="418.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">MTProto</text><rect x="192" y="390" width="194" height="42" rx="21" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="289.0" y="418.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">FakeTLS · ee</text><rect x="396" y="390" width="181" height="42" rx="21" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="486.5" y="418.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Secure · dd</text><rect x="52" y="444" width="130" height="42" rx="21" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="117.0" y="472.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Classic</text><rect x="135" y="506" width="370" height="66" rx="33" fill="#FFFFFF" /><text x="164" y="548.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="25" font-weight="800" fill="#135CCF">Open on GitHub</text><g class="rm3"><path d="M453.5 539.0h22.5m-9.5-9.5 9.5 9.5-9.5 9.5" fill="none" stroke="#135CCF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" /><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.8s" repeatCount="indefinite" /></g><rect x="1" y="1" width="638" height="598" rx="21" stroke="#EFF2F9" stroke-opacity=".30" fill="none" /><path d="M16 2H624" stroke="url(#edge)" stroke-width="2" /></g></svg>
