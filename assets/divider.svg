<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 34" width="1280" height="34"
     role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".28" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#A78BFA" stop-opacity=".85"/>
      <stop offset=".72" stop-color="#22C55E" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="16" width="1280" height="1.5" fill="url(#dl)"/>
  <g transform="translate(640,17)">
    <circle r="5.5" fill="#0B1120" stroke="#A78BFA" stroke-width="1.4"/>
    <circle r="2.2" fill="#A78BFA">
