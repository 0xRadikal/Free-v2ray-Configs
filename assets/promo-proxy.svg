<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Free Telegram Proxy — the sister project"><style>@media (prefers-reduced-motion: reduce){.rm0{opacity:0.5!important}.rm1{transform:none!important;opacity:0!important}.rm2{opacity:.9!important}.rm3{transform:none!important}}</style><title>Free Telegram Proxy — the sister project</title><desc>Sister project by Raydikalx: free MTProto proxies for Telegram (FakeTLS ee, secure dd and classic), each verified in three rounds by relaying a real request to a Telegram datacenter, updated about every 15 minutes. Opens the GitHub repository.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247EFD" /><stop offset=".58" stop-color="#2076F0" /><stop offset="1" stop-color="#135CCF" /></linearGradient><radialGradient id="cloud"><stop stop-color="#B4D8FF" stop-opacity=".24" /><stop offset="1" stop-color="#B4D8FF" stop-opacity="0" /></radialGradient><linearGradient id="sweep"><stop stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".14" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient><linearGradient id="edge"><stop stop-color="#EFF2F9" stop-opacity=".12" /><stop offset=".45" stop-color="#EFF2F9" stop-opacity=".8" /><stop offset="1" stop-color="#EFF2F9" stop-opacity=".12" /></linearGradient><clipPath id="round"><rect width="1280" height="300" rx="22" /></clipPath></defs><g clip-path="url(#round)"><rect width="1280" height="300" fill="url(#bg)" /><circle cx="192" cy="30" r="225" fill="url(#cloud)" opacity=".5" class="rm0"><animate attributeName="opacity" values=".34;.58;.34" dur="11s" repeatCount="indefinite" /></circle><circle cx="1190" cy="255" r="180" fill="url(#cloud)" opacity=".4" /><g class="rm1" transform="translate(-400 0)"><rect x="0" y="0" width="260" height="300" fill="url(#sweep)" transform="skewX(-18)" /><animateTransform attributeName="transform" type="translate" values="-400 0;1680 0" dur="7s" repeatCount="indefinite" /></g><rect x="66" y="46" width="208" height="208" rx="33" fill="#EFF2F9" fill-opacity=".14" stroke="#EFF2F9" stroke-opacity=".35" /><circle cx="170" cy="150" r="74" fill="none" stroke="#EFF2F9" stroke-width="4.6" stroke-opacity=".7" /><g fill="none" stroke="#EFF2F9" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><path d="M126.3 147.4 213.7 113.0 195.1 187.0 174.0 168.5 160.7 187.0 160.7 163.2Z" fill="#EFF2F9" fill-opacity=".16" /><path d="M160.7 163.2L213.7 113.0" stroke-opacity=".7" /></g><circle cx="221.8" cy="97.5" r="10.6" fill="#FFFFFF" stroke="#135CCF" stroke-width="3.4" /><circle cx="97.5" cy="164.8" r="10.6" fill="#FFFFFF" stroke="#135CCF" stroke-width="3.4" /><circle cx="203.3" cy="215.9" r="10.6" fill="#FFFFFF" stroke="#135CCF" stroke-width="3.4" /><circle cx="221.8" cy="97.5" r="23.1" fill="#FFFFFF" opacity=".9" class="rm2" fill-opacity=".35"><animate attributeName="opacity" values=".9;0;.9" dur="2.6s" repeatCount="indefinite" /></circle><text x="320" y="82" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="760" fill="#DBEBFF" letter-spacing="2.2">RAYDIKALX · SISTER PROJECT</text><text x="318" y="142" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="54" font-weight="820" fill="#EFF2F9">Free Telegram Proxy</text><text x="320" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="21" font-weight="560" fill="#DBEBFF">Free MTProto proxies — open in Telegram with one tap</text><rect x="320" y="206" width="97" height="36" rx="18" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="368.5" y="229.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">MTProto</text><rect x="427" y="206" width="145" height="36" rx="18" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="499.5" y="229.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">FakeTLS · ee</text><rect x="582" y="206" width="136" height="36" rx="18" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="650.0" y="229.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Secure · dd</text><rect x="728" y="206" width="97" height="36" rx="18" fill="#EFF2F9" fill-opacity=".16" stroke="#EFF2F9" stroke-opacity=".38" /><text x="776.5" y="229.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Classic</text><rect x="960" y="108" width="290" height="64" rx="32" fill="#FFFFFF" /><text x="984" y="147.56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="21" font-weight="800" fill="#135CCF">Open on GitHub</text><g class="rm3"><path d="M1207.1 140.0h18.9m-8.0-8.0 8.0 8.0-8.0 8.0" fill="none" stroke="#135CCF" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" /><animateTransform attributeName="transform" type="translate" values="0 0;5 0;0 0" dur="1.8s" repeatCount="indefinite" /></g><text x="1105" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="15" font-weight="600" fill="#DBEBFF" text-anchor="middle">Verified 3× · every ~15 min</text><rect x="1" y="1" width="1278" height="298" rx="21" st