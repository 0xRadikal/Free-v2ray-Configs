<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 142" width="264" height="142"
     role="img" aria-label="Star the repository on GitHub"><title>Star the repository on GitHub</title>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#131F38"/><stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="cs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FBBF24" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FBBF24" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cr" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity=".17"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cc"><rect width="264" height="142" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <rect width="264" height="142" fill="url(#cg)"/>
    <rect width="264" height="142" fill="#FBBF24" fill-opacity=".05"/>
    <ellipse cx="132" cy="46" rx="105" ry="62" fill="url(#cr)"/>
    <rect x="-120" y="0" width="120" height="142" fill="url(#cs)">
      <animate attributeName="x" values="-120;264" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="264" height="2" fill="url(#ct)"/>

    <circle cx="132" cy="46" r="27" fill="#FBBF24" fill-opacity=".16"/>
    <circle cx="132" cy="46" r="27" fill="none" stroke="#FBBF24" stroke-opacity=".55"
            stroke-width="1.4">
      <animate attributeName="r" values="27;33" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".55;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(117,31) scale(1.25)" fill="#FBBF24" color="#FBBF24"><path d="M12 1.8l3.1 6.4 7 1-5 4.9 1.2 7-6.3-3.3-6.3 3.3 1.2-7-5-4.9 7-1z"/></g>

    <text x="132" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="20"
          font-weight="800" fill="#FFFFFF">Star this repo</text>
    <text x="132" y="121" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif" font-size="12.5"
          fill="#94A3B8">It keeps this discoverable</text>
  </g>
  <rect x=".75" y=".75" width="262.5" height="140.5" rx="20" fill="none"
        stroke="#FBBF24" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
