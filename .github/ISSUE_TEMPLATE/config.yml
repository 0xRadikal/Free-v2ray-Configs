# Forces reporters through the forms below, which exist because free-config
# repositories otherwise drown in unactionable "doesn't work" reports.
blank_issues_enabled: false

contact_links:
  - name: 💬 Telegram channel — updates & general questions
    url: https://t.me/Raydikalx
    about: Announcements and general questions. Faster than an issue for "how do I use this".

  - name: 🤖 Telegram bot
    url: https://t.me/RaydikalxBot
    about: Get configs through the bot.

  - name: 🔐 Report a security issue
    url: https://github.com/0xRadikal/Free-v2ray-Configs/blob/main/SECURITY.md
    about: Read this first. If public disclosure would put users at risk, report privately via Telegram instead of opening an issue.

  - name: 🩺 Is a source down? Check health.json first
    url: https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/health.json
    about: Per-source status, HTTP code, latency and last error — regenerated every run. Also carries the `cascade` block with this release's measured success rates.

  - name: 🧪 "Most configs are dead" — this is measured, not hidden
    url: https://github.com/0xRadikal/Free-v2ray-Configs#-does-it-actually-work
    about: The large majority of any free config pool is dead at any moment. Read this before reporting it as a bug.
