# Shows a "Sponsor" button at the top of the repository.
#
# This project has no GitHub Sponsors profile and no payment processor. Support
# is crypto-only and entirely optional — every link the repo publishes works the
# same whether or not anyone ever donates. The custom link therefore points at
# the tip section of the README, where the addresses sit next to a QR code for
# each network (TRC20 / EVM / TON).
#
# Schema: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

custom: ["https://github.com/0xRadikal/Free-v2ray-Configs#-optional--leave-a-tip"]
